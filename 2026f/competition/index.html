<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Noto+Sans+Mono:wght@100..900&display=swap" rel="stylesheet">

  <title>Competition Practice: October 30</title>
  <style>
    body {
      font-family: "Noto Sans Mono", 'Segoe UI','Lucida Grande','Open Sans', sans-serif;
      font-size:1.1rem;
      margin:auto;
      max-width:45em;
      padding:1em;
      font-family: Arial, sans-serif;
      background: #f4f4f9;
    }

    h1 {
        font-family: "Noto Sans Mono";
        font-size: 3.4em;
    }

    .playlist-container {
      background: #fff;
      padding: 20px;
      margin-bottom: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    audio {
      width: 100%;
      margin-bottom: 10px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
    }

    li.active {
      background-color: #007bff;
      color: white;
      font-weight: bold;
    }

    .narrow-player {
      /* Set a small horizontal width */
      width: 140px;
      height: 40px;
      border-radius: 20px;
    }

    /* Hide the volume control/slider in WebKit browsers (Chrome, Edge, Safari) */
    .narrow-player::-webkit-media-controls-volume-control-container,
    .narrow-player::-webkit-media-controls-mute-button,
    .narrow-player::-webkit-media-controls-volume-slider {
      display: none !important;
    }

    /* Hide the total time/duration display to fit the narrow layout */
    .narrow-player::-webkit-media-controls-time-remaining-display,
    .narrow-player::-webkit-media-controls-current-time-display {
      display: none !important;
    }
    /* 2. Optional: Adjust remaining controls to fill the freed space cleanly */
    .narrow-player::audio::-webkit-media-controls-panel {
    padding: 0 8px;
    }
  </style>
</head>
<body>

    <div style="display: flex;">
        <div><h1 style="max-width: 30rem;">Competition Practice</h1></div>
        <div style="">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
            <!-- Ghost Body (Sheet Silhouette) -->
            <path d="M 28 50 C 28 18 72 18 72 50 C 72 68 82 78 82 90 C 72 82 62 92 50 82 C 38 92 28 82 18 90 C 18 78 28 68 28 50 Z" fill="#f4f6f9" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round" />

            <!-- Linen Fabric Folds (Interior Shadow Lines) -->
            <path d="M 28 52 Q 33 68 36 84 M 40 55 Q 44 68 46 80 M 60 55 Q 56 68 54 80 M 72 52 Q 67 68 64 84" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

            <!-- Facial Features -->
            <ellipse cx="43" cy="40" rx="4" ry="7" fill="#1e293b" />
            <ellipse cx="57" cy="40" rx="4" ry="7" fill="#1e293b" />
            <ellipse cx="50" cy="53" rx="3" ry="5" fill="#1e293b" />
            </svg>
        </div>
    </div>
    <div style="display: flex; align-items: center; gap: 20px;">
        <div>Opening theme: </div>
        <div><audio  class="audio-player narrow-player" controls title="Who wants to be a millionaire opening theme" src="media/01 Main Theme.mp3"></audio></div>
    </div>

  <!-- Playlist 1 -->
  <div class="playlist-container">
    <h2>Album A</h2>
    <audio class="audio-player" controls></audio>
    <ul class="playlist">
        <li data-src="media/Play.mp3" class="active">Track 1</li>
      <li data-src="media/14 Question.mp3">Track 2</li>
      <li data-src="media/Interloper.mp3">Track 3</li>
    </ul>
  </div>

  <!-- Playlist 2 -->
  <div class="playlist-container">
    <h2>Album B</h2>
    <audio class="audio-player" controls></audio>
    <ul class="playlist">
      <li data-src="albumB-track1.mp3" class="active">Track 1</li>
      <li data-src="albumB-track2.mp3">Track 2</li>
    </ul>
  </div>

  <script>
    // Reusable initializer scoped to each container
    function initPlaylist(container) {
      const audioPlayer = container.querySelector('.audio-player');
      const playlistItems = container.querySelectorAll('.playlist li');
      let currentTrack = 0;

      function loadTrack(index) {
        if (index < 0 || index >= playlistItems.length) return;

        currentTrack = index;
        const trackSrc = playlistItems[currentTrack].getAttribute('data-src');
        audioPlayer.src = trackSrc;

        playlistItems.forEach(item => item.classList.remove('active'));
        playlistItems[currentTrack].classList.add('active');

        audioPlayer.play().catch(err => {
          console.log("Autoplay prevented:", err);
        });
      }

      // Auto-advance when current song ends
      audioPlayer.addEventListener('ended', () => {
        currentTrack++;
        if (currentTrack < playlistItems.length) {
          loadTrack(currentTrack);
        } else {
          currentTrack = 0;
          loadTrack(currentTrack);
        }
      });

      // Track click event
      playlistItems.forEach((item, index) => {
        item.addEventListener('click', () => {
          loadTrack(index);
        });
      });

      // Set initial src
      if (playlistItems.length > 0) {
        audioPlayer.src = playlistItems[0].getAttribute('data-src');
      }
    }

    // Initialize every container on the page
    document.querySelectorAll('.playlist-container').forEach(initPlaylist);
  </script>

</body>
</html>
